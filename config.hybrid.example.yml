# Server V1 Hybrid 配置模板（DashScope 云 + 本地 vLLM，**不含任何密钥**）
#
# 用途：GPU（RTX 4090D）开启后的 Local + Cloud 混合运行配置。
# 与 config.server.example.yml（Fake 验收专用）的区别：本文件包含完整的
#   cognition（模型 provider）/ search / roles（角色映射）三个真实配置块。
#
# 使用方式（GPU 机器上）：
#   1. cp config.hybrid.example.yml config.yml      # config.yml 已在 .gitignore 中
#   2. 在 config.yml 中填入真实 DASHSCOPE_API_KEY / TAVILY_API_KEY（勿提交）
#   3. .env.server：APP_ENV=development、ALLOW_LIVE_EXTERNAL_APIS=true，
#      CHECKPOINTER_BACKEND=redis 保持不变
#   4. 启动本地模型服务：bash scripts/model-service/start_vllm.sh
#
# 全 Cloud 回滚：见文件末尾注释，只改 4 行 roles，无需改代码。

stages:
  prod:

    # ---- Redis：job 队列 + 事件流 + checkpointer（硬依赖，不降级）----
    redis:
      enabled: true
      url: redis://127.0.0.1:6379
      db: 0
      review_ttl_seconds: 600

    # ---- 任务持久化：SQLite ----
    database:
      backend: sqlite
      sqlite:
        path: data/tasks.db

    # ---- LangGraph checkpointer（必须持久化）----
    memory:
      checkpoint:
        backend: redis

    # ---- Context Budget（Phase 2 P1：请求发出前的 token 预算）----
    # 可选块；缺省时使用内置默认值（reserve 1024 / safety 256）。
    # 预算等式：prompt + reserved_output + safety_margin <= context_limit
    # limit 解析优先级：
    #   1. cognition.<backend>.models.<handle>.context_window（集中配置）
    #   2. 环境变量 DR_BASELINE_LOCAL_CONTEXT_LIMIT（仅本地 backend）
    #   3. vLLM /v1/models 的 max_model_len（仅本地 backend）
    # 云端 role 未配置 context_window 时**不裁剪**（拿不到 limit，不按本地 8192 误伤）。
    context_budget:
      reserve_output_tokens: 1024
      safety_margin_tokens: 256

    # ---- 模型 provider ----
    cognition:

      # 云端：DashScope OpenAI-compatible。
      # ⚠️ backend 名保持 "openai" 不变：向量记忆的 embedding 客户端
      #    （deep_research/memory/vector_store.py）也读取这个键。
      #    handle（deepseek-v4-pro / deepseek-v4-flash）需与生产实际
      #    模型名一致。
      openai:
        base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api_key: ""              # ← 部署时填入真实 key；不要提交
        # 可选：temperature / models.<handle>.max_tokens 按生产实际值补充

      # 本地：vLLM OpenAI-compatible（scripts/model-service/ 管理，端口 8001）。
      # api_key 为 vLLM 约定的非敏感占位符，禁止复用任何真实云端 key。
      openai_local:
        base_url: http://127.0.0.1:8001/v1
        api_key: EMPTY
        # Qwen3 默认开启思考模式；此处与 qwen3-32b 的既有处理保持一致，
        # 显式关闭。vLLM 通过 chat_template_kwargs 透传该开关
        # （最终以 GPU 阶段的 vLLM 实际支持情况为准）。
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
        # 可选：集中声明各模型的 context window（优先于 /v1/models 探测）。
        # models:
        #   qwen3-30b-a3b-local:
        #     context_window: 8192

    # ---- 搜索（Tavily）----
    search:
      backend: tavily
      tavily:
        api_key: ""              # ← 部署时填入真实 key；不要提交
        max_results: 3
        topic: general
        include_raw_content: true

    # ---- 角色 → 模型映射（第一版 Hybrid，非 benchmark 最优）----
    #
    # LOCAL（RTX 4090D / vLLM / Qwen3-30B-A3B-GPTQ-Int4）：
    #   研究链路上 token 量最大的四个角色
    # CLOUD（DashScope）：规划/写作关键路径 + 低成本小角色
    roles:

      # ===== CLOUD（DashScope）=====
      supervisor:            { backend: openai,       handle: deepseek-v4-pro }
      writer:                { backend: openai,       handle: deepseek-v4-pro }
      evaluator:             { backend: openai,       handle: deepseek-v4-flash }
      red_team:              { backend: openai,       handle: deepseek-v4-flash }
      # draft 实际调用由 get_chat_model_auto() 按 query 复杂度路由到
      # evaluator / writer（见 deep_research/llm.py），此条目供直接调用
      # draft 角色的代码路径使用；保持当前生产行为，不在本轮重新设计。
      draft:                 { backend: openai,       handle: deepseek-v4-pro }

      # ===== LOCAL（vLLM / qwen3-30b-a3b-local）=====
      # handle 必须与 vLLM --served-model-name 一致（见 start_vllm.sh）
      researcher_main:       { backend: openai_local, handle: qwen3-30b-a3b-local }
      researcher_compressor: { backend: openai_local, handle: qwen3-30b-a3b-local }
      researcher_summarizer: { backend: openai_local, handle: qwen3-30b-a3b-local }
      # context_pruner 在当前代码中暂无调用点，保留配置以对齐角色清单
      context_pruner:        { backend: openai_local, handle: qwen3-30b-a3b-local }

# ===== 全 Cloud 回滚（Local Model Service 故障时）=====
# 仅需把上面 4 个 LOCAL 角色改成（无需改任何代码，无需重启 vLLM 之外的服务）：
#
#   researcher_main:       { backend: openai, handle: deepseek-v4-pro }
#   researcher_compressor: { backend: openai, handle: deepseek-v4-flash }
#   researcher_summarizer: { backend: openai, handle: deepseek-v4-flash }
#   context_pruner:        { backend: openai, handle: deepseek-v4-flash }
