name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      ALLOW_LIVE_EXTERNAL_APIS: "false"
      LLM_PROVIDER: fake
      SEARCH_PROVIDER: fake
      CHECKPOINTER_BACKEND: sqlite
      DR_MEMORY_OUTBOX_ENABLED: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e ".[dev]"
      - name: Repository contract
        run: python scripts/check_repo_hygiene.py
      - name: Lint critical errors
        run: ruff check deep_research backend tests scripts/check_repo_hygiene.py
      - name: Compile Python sources
        run: python -m compileall -q deep_research backend scripts tests
      - name: Offline test suite
        run: pytest -q -m "not live"
      - name: Regenerate ignored deterministic benchmark fixtures
        run: python benchmarks/fixtures/build_public_datasets.py
      - name: Benchmark protocol tests
        run: python -m unittest discover -s benchmarks/tests -v
      - name: Verify committed offline results
        run: python benchmarks/publish_offline.py --verify
