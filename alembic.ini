# Alembic configuration
#
# NOTE: this file must stay ASCII-only.
# Alembic reads alembic.ini using encoding="locale" (see
# alembic/util/compat.py::read_config_parser), which is GBK on zh-CN Windows.
# Non-ASCII characters here cause a UnicodeDecodeError before any migration runs.
#
# sqlalchemy.url is deliberately NOT set here. The URL is resolved at runtime
# by migrations/env.py via backend.db.engine.resolve_database_url(), so the
# database path has a single source of truth.
#
# Common commands:
#   alembic upgrade head          apply all migrations
#   alembic current               show current revision
#   alembic stamp head            mark an existing DB as up-to-date (no DDL)
#   alembic revision -m "..."     create a new migration

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
