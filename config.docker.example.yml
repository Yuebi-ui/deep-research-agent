# Docker Compose Fake 模式配置模板（**不含任何密钥**）
#
# 用法：
#     docker compose up --build
# Docker Compose 默认将此文件只读挂载为 /app/config.yml。
#
# 为什么这份模板这么短？
# ----------------------
# 首次 Server Runtime 验收使用 **Fake Provider**：
#
#     APP_ENV=test
#     LLM_PROVIDER=fake / SEARCH_PROVIDER=fake
#
# 在 Fake 模式下：
#   * LLM 客户端在**读取本文件之前**就短路返回 Fake，
#     因此不需要 `cognition`（模型/API Key）与 `roles`（角色映射）；
#   * 搜索 provider 同理，不需要 `search`；
#   * embedding 走确定性伪向量，不需要凭据。
#
# 本模板用于容器间通信的 Fake 模式配置。数据库版本由当前 migrations/
# 和 `alembic upgrade head` 决定，不要依赖历史测试的版本号。
# 需要真实模型时，请配置 `cognition` / `search` / `roles` 和相应的密钥，
# 并设置合适的 APP_ENV、Provider 与外部调用开关。

stages:
  prod:

    # ---- Context Budget（Phase 2 P1，可选）----
    # 请求发出前的 token 预算，防止 researcher_summarizer 等本地 role
    # 因网页内容超长触发 provider 400。缺省用内置默认值（1024/256）。
    # 仅在 role 能解析到 context_limit（config / 本地探测）时生效。
    context_budget:
      reserve_output_tokens: 1024
      safety_margin_tokens: 256

    # ---- Redis：job 队列 + 事件流 + checkpointer ----
    #
    # 三项职责都依赖 Redis，因此这里是**硬依赖**：
    #   * Redis 不可达 → API 启动时报错（不静默降级）
    #   * checkpointer 不可达 → Worker 启动时直接退出
    redis:
      enabled: true
      url: redis://redis:6379
      db: 0
      # 审查决定的有效期（秒）。注意审查决定本身是落 SQLite 的，
      # 这个值只影响旧版缓存路径。
      review_ttl_seconds: 600

    # ---- 任务持久化：SQLite ----
    #
    # Server V1 正式支持并测试的唯一 Task DB。
    # path 为相对路径时按**项目根目录**解析，不依赖进程 cwd。
    database:
      backend: sqlite
      sqlite:
        path: data/tasks.db

    # ---- LangGraph checkpointer ----
    #
    # 必须持久化：跨进程恢复（Worker 崩溃后由新 Worker 接管）的前提。
    # 用 memory 会让恢复能力失效 —— Worker 启动时会**直接拒绝** memory 后端。
    #
    # 也可以用环境变量覆盖：CHECKPOINTER_BACKEND=redis
    memory:
      checkpoint:
        backend: redis
