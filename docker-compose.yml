# API-first runtime. Default Docker config uses service hostname `redis` and
# fake providers. Host/AutoDL config templates deliberately keep 127.0.0.1.
# Override DR_COMPOSE_CONFIG_FILE to mount a private YAML config when needed;
# pass external-provider secrets separately (do not commit them).

services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ${DR_COMPOSE_CONFIG_FILE:-./config.docker.example.yml}:/app/config.yml:ro
      - ./data:/app/data
    environment:
      APP_ENV: ${APP_ENV:-development}
      STAGE: ${STAGE:-prod}
      CONFIG_PATH: /app/config.yml
      CHECKPOINTER_BACKEND: redis
      ALLOW_LIVE_EXTERNAL_APIS: ${ALLOW_LIVE_EXTERNAL_APIS:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-fake}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    volumes:
      - ${DR_COMPOSE_CONFIG_FILE:-./config.docker.example.yml}:/app/config.yml:ro
      - ./data:/app/data
    environment:
      APP_ENV: ${APP_ENV:-development}
      STAGE: ${STAGE:-prod}
      CONFIG_PATH: /app/config.yml
      CHECKPOINTER_BACKEND: redis
      ALLOW_LIVE_EXTERNAL_APIS: ${ALLOW_LIVE_EXTERNAL_APIS:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-fake}
      # Dedicated memory-worker owns the outbox in this Compose topology.
      DR_MEMORY_OUTBOX_POLL_ON_WORKER: "off"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  memory-worker:
    build: .
    command: ["python", "-m", "backend.memory_worker"]
    volumes:
      - ${DR_COMPOSE_CONFIG_FILE:-./config.docker.example.yml}:/app/config.yml:ro
      - ./data:/app/data
    environment:
      APP_ENV: ${APP_ENV:-development}
      STAGE: ${STAGE:-prod}
      CONFIG_PATH: /app/config.yml
      DR_MEMORY_OUTBOX_ENABLED: "on"
      ALLOW_LIVE_EXTERNAL_APIS: ${ALLOW_LIVE_EXTERNAL_APIS:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-fake}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
